version: '3.8'

services:
  uav-patrol-dashboard:
    build:
      context: .
      args:
        # Define your production backend API URLs here
        - VITE_API_BASE_URL=http://localhost:8081
        - VITE_WS_BASE_URL=ws://localhost:8081
        - VITE_STREAM_API_URL=http://172.20.0.10:8054
        - VITE_WHEP_URL=http://172.20.0.10:8054
        - VITE_DETECTIONS_WS_URL=ws://[IP_ADDRESS]
        - VITE_DUMMY_STREAM=false
        - VITE_API_BASE_URL_DOCKING=http://[IP_ADDRESS]
    ports:
      - "80:80"
    restart: unless-stopped
